# Student distillation from the teacher ACT (scripts/training/train_distil.py --task <task>).
# action_dim/joint_dim come from training.tasks.<task> — the student is the
# same shape contract as its teacher. teacher/checkpoint_dir/checkpoint_prefix/
# hub/log_file are task-specific; everything else (student architecture,
# distillation loss weights) is shared.

distillation:
  embed_dim: 128
  latent_dim: 64
  num_layers: 2
  nhead: 4
  num_cameras: 2
  temperature: 2.0
  alpha: 0.5
  gamma: 0.2

  wandb:
    project: "distil_act"
    entity: "jg_projects"

  tasks:
    reach:
      log_file: "logs/distillation_reach.log"
      checkpoint_dir: "artifacts"
      checkpoint_prefix: "distil_act_model"

      teacher:
        checkpoint: "artifacts/act_model_final.pt"
        repo_id: "jgilewicz/distil_act_teacher"
        filename: "act_model_final.pt"
        auto_pull: true

      hub:
        repo_id: "jgilewicz/distil_act_student"
        filename: "distil_act_model_final.pt"
        auto_push: false

    pick_and_place:
      log_file: "logs/distillation_pick_and_place.log"
      checkpoint_dir: "artifacts"
      checkpoint_prefix: "pick_and_place_distil_model"

      teacher:
        checkpoint: "artifacts/pick_and_place_model_final.pt"
        repo_id: "jgilewicz/distil_act_pick_and_place_teacher"
        filename: "pick_and_place_model_final.pt"
        auto_pull: true

      hub:
        repo_id: "jgilewicz/distil_act_pick_and_place_student"
        filename: "pick_and_place_distil_model_final.pt"
        auto_push: false
