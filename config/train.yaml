# Teacher ACT training (scripts/training/train_act.py --task <task>).
# action_dim/joint_dim/checkpoint/hub/log_file are task-specific (the two tasks
# record different qpos dims — reach: PiPER's 8 (joint1-6 arm + joint7/8
# gripper); pick: box's 7-dof freejoint + PiPER's 8). joint_dim is
# the full recorded qpos (context input); action_dim/action_qpos_offset select
# the robot-actuated slice of that same qpos that the model predicts and sends
# to env.step() as ctrl. PiPER has nu=7 actuators (joint1-6 + one gripper
# actuator driving joint7) — joint8 mirrors joint7 via an MJCF equality
# constraint and has no actuator, so it's excluded from the action slice: for
# reach that's qpos[0:7], for pick qpos[7:14] (box occupies
# qpos[0:7]). Everything else is architecture/optimizer config shared across
# tasks.

training:
  embed_dim: 256
  latent_dim: 128
  nhead: 8
  num_layers: 4
  num_cameras: 2
  beta: 0.05
  chunk_size: 50
  batch_size: 64
  val_ratio: 0.1
  num_workers: 8
  max_steps: 50000
  warmup_steps: 1000
  log_interval: 1000
  save_interval: 10000
  lr: 0.00015

  wandb:
    project: "distil_act"
    entity: "jg_projects"

  tasks:
    reach:
      action_dim: 7
      joint_dim: 8
      action_qpos_offset: 0
      log_file: "logs/training_reach.log"
      checkpoint_dir: "artifacts"
      checkpoint_prefix: "act_model"

      hub:
        repo_id: "jgilewicz/distil_act_teacher"
        filename: "act_model_final.pt"
        auto_push: false

    pick:
      action_dim: 7
      joint_dim: 15
      action_qpos_offset: 7
      log_file: "logs/training_pick.log"
      checkpoint_dir: "artifacts"
      checkpoint_prefix: "pick_model"

      hub:
        repo_id: "jgilewicz/distil_act_pick_teacher"
        filename: "pick_model_final.pt"
        auto_push: false
