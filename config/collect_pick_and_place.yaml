# Physics, IK expert, and collection config for pick-and-place data gathering
# (scripts/collection/collect_pick_and_place_data.py). Kept in its own file with
# prefixed top-level keys since load_config() merges every yaml into one dict and
# the pick-and-place env/expert take different kwargs than the reach ones in
# simulation.yaml / collect_reach.yaml.

pick_and_place_env:
  scene_xml_path: "models/pick_and_place_scene.xml"
  box_x_range: [-0.10, -0.06]
  box_y_range: [0.13, 0.15]
  placement_x_range: [0.06, 0.10]
  placement_y_range: [0.13, 0.15]
  box_height: 0.01
  placement_threshold: 0.1

pick_and_place_expert:
  dt: 0.01
  solver: "daqp"
  max_iters: 10
  ik_pos_threshold: 0.05
  approach_height: 0.1
  grasp_clearance: 0.02

pick_and_place_collection:
  n_episodes: 200
  n_steps: 1000
  dataset_dir: "data/pick_and_place"
  log_file: "logs/pick_and_place_data_gathering.log"
  render_cameras:
    - "overhead_cam"
    - "ego_cam"

  hub:
    repo_id: "jgilewicz/distil_act_pick_and_place_env"
    auto_pull: false
    auto_push: false
