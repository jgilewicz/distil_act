[project]
name = "act-distill"
version = "0.1.0"
description = "ACT visuomotor policy distillation for a MuJoCo reach task"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "h5py>=3.16.0",
    "huggingface-hub>=0.27.0",
    "mujoco>=3.9.0",
    "opencv-python>=4.13.0.92",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "wandb>=0.19",
    "robot-descriptions>=2.0.0",
    "nvidia-curobo[cu13] @ git+https://github.com/NVlabs/curobo.git@8e734f3ced1df898990bcd92de40abce475907db ; sys_platform == 'linux'",
    "ruff>=0.15.18",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
    "onnxruntime>=1.27.0",
    "tensorrt>=11.1.0.106; sys_platform == 'linux'",
    "cuda-python>=13.3.1; sys_platform == 'linux'",
    "nvidia-modelopt>=0.45.0",
    "onnx-graphsurgeon>=0.6.1",
    "onnxslim>=0.1.94",
    "lief>=1.0.0",
    "polygraphy>=0.50.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/env", "src/expert", "src/renderer", "src/dataset", "src/algorithms", "src/utils"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]
